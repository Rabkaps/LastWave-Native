android {
    namespace 'com.lastwave.app'
    compileSdk 37

    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    def envFile = rootProject.file(".env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (!trimmed.isEmpty() && !trimmed.startsWith("#") && trimmed.contains("=")) {
                def parts = trimmed.split("=", 2)
                localProps.setProperty(parts[0].trim(), parts[1].trim())
            }
        }
    }

    def resolveSecret = { String... keys ->
        for (key in keys) {
            def fromEnv = System.getenv(key)
            if (fromEnv != null && !fromEnv.trim().isEmpty()) {
                return fromEnv.trim().replace("\r", "").replace("\n", "").replace("\"", "").replace("\\", "")
            }
            def fromGradle = project.findProperty(key) as String
            if (fromGradle != null && !fromGradle.trim().isEmpty()) {
                return fromGradle.trim().replace("\r", "").replace("\n", "").replace("\"", "").replace("\\", "")
            }
            def fromLocal = localProps.getProperty(key)
            if (fromLocal != null && !fromLocal.trim().isEmpty()) {
                return fromLocal.trim().replace("\r", "").replace("\n", "").replace("\"", "").replace("\\", "")
            }
            def dotEnv = rootProject.file(".env")
            if (dotEnv.isFile()) {
                def found = null
                dotEnv.eachLine { l ->
                    def trimmed = l.trim()
                    if (trimmed.startsWith("${key}=")) {
                        def v = trimmed.substring(key.length() + 1).trim().replace("\"", "").replace("\\", "")
                        if (!v.isEmpty()) found = v
                    }
                }
                if (found != null) return found
            }
        }
        return ""
    }

    defaultConfig {
        applicationId 'com.lastwave.app'
        minSdk = (project.findProperty("minSdk") as String)?.toInteger() ?: 29
        targetSdk 35
        versionCode 26
        versionName '4.3.1'

        def lastWaveLyricsToken = resolveSecret("LASTWAVE_LYRICS_TOKEN")
        def lastWaveLyricsUrl = resolveSecret("LASTWAVE_LYRICS_URL")
        buildConfigField "String", "LASTWAVE_LYRICS_TOKEN", "\"$lastWaveLyricsToken\""
        buildConfigField "String", "LASTWAVE_LYRICS_URL", "\"$lastWaveLyricsUrl\""

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
                cFlags "-Wl,-z,max-page-size=16384"
                cppFlags "-Wl,-z,max-page-size=16384"
            }
        }
    }

    signingConfigs {
        release_config {
            def base64Key = resolveSecret("SIGNING_KEY")
            def storeFilePath = resolveSecret("RELEASE_STORE_FILE")
            def storePasswordProp = resolveSecret("RELEASE_STORE_PASSWORD", "KEY_STORE_PASSWORD")
            def keyAliasProp = resolveSecret("RELEASE_KEY_ALIAS", "ALIAS") ?: "release_key"
            if (keyAliasProp.trim().isEmpty()) keyAliasProp = "release_key"
            def keyPasswordProp = resolveSecret("RELEASE_KEY_PASSWORD", "KEY_PASSWORD") ?: storePasswordProp
            if (keyPasswordProp.trim().isEmpty()) keyPasswordProp = storePasswordProp

            File keystoreFile = null
            if (!base64Key.trim().isEmpty()) {
                try {
                    byte[] decodedBytes = Base64.getDecoder().decode(base64Key.trim())
                    File tempKeystore = layout.buildDirectory.file("signing/release.keystore").get().asFile
                    tempKeystore.parentFile.mkdirs()
                    tempKeystore.bytes = decodedBytes
                    keystoreFile = tempKeystore
                } catch (Exception ignored) {
                }
            } else if (!storeFilePath.trim().isEmpty()) {
                keystoreFile = file(storeFilePath)
            }

            if (keystoreFile != null && keystoreFile.exists() && !storePasswordProp.trim().isEmpty()) {
                storeFile keystoreFile
                storePassword storePasswordProp
                keyAlias keyAliasProp
                keyPassword keyPasswordProp
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            } else {
                def requestsRelease = gradle.startParameter.taskNames.any { it.contains("Release") }
                if (requestsRelease) {
                    throw new GradleException("No release signing key found.")
                }
                initWith(signingConfigs.debug)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release_config
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        rawRelease {
            initWith release
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release_config
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        compose true
        buildConfig true
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        ignoreWarnings true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

