tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        optIn.add("androidx.compose.foundation.ExperimentalFoundationApi")
    }
}

configurations.all {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.jetbrains.kotlin') {
            useVersion libs.versions.kotlin.get()
        }
    }
}

tasks.withType(Test) {
    maxHeapSize = '2048m'
}

def generateNativeSecrets = tasks.register("generateNativeSecrets", Exec) {
    workingDir rootProject.projectDir
    def py = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "python" : "python3"
    commandLine py, "tools/generate_native_secrets.py"
    ignoreExitValue = true
}

tasks.matching { it.name.startsWith("preBuild") || it.name.startsWith("configureCMake") }.configureEach {
    dependsOn generateNativeSecrets
}
