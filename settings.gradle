    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "LastWave"
include ':app'
include ':core'
include ':wear'
include ':audio:decent-usb-audio-driver'
